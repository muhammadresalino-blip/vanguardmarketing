# Deploy API + PostgreSQL di Render (https://render.com).
# Frontend statis tetap di Vercel/Netlify; isi VITE_API_URL dengan URL layanan ini.
services:
  - type: web
    name: vanguard-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile --prod
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vanguard-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: vanguard-db
    plan: free
    databaseName: vanguard
    user: vanguard
